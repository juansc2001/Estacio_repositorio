<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <style>
        table {
        width: 100%;
        border-collapse: collapse; 
        }

        th, td {
        border: 1px solid ;
        padding: 10px;             
        }
    </style>

    <table>
        <caption>horario do curso</caption>
        <thead>
            <tr>
                <th scope="col">dia</th>
                <th scope="col">horario</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <th scope="row">segunda</th>
                <td>19h as 21h</td>
            </tr>
            <tr>
                <th scope="row">terça</th>
                <td colspan="1">19h as 21h</td>
            </tr>
        </tbody>
    </table>
