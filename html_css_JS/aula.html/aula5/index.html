<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>menu</title>

    <style>
        * {
            margin: 0;
            padding: 0;
        }
        body{
            background-image: url("https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQvo6L4Ztaz8RzLP00A0iuQOppyWfzTfsN_pPzaSsXUWbgXfdsdDQJRo8E&s=10a");
            background-repeat: no-repeat;
            background-size: cover;
        }
        h1{
            margin-right: 30vw;
            text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.5);
            color: antiquewhite;
            
        }
        .lista{
            list-style: none;
            display: none;
            position: relative;
            right: 250px;
            
            

            width: 300px;
            height: 500px;
            border: solid;
        }

        nav{
            border: solid;
            border-radius: 20px;
            background-color: rgba(167, 31, 133, 0.397);
            width: 99vw;
            height: 10vw;

            display: flex;
            justify-content: right;
            align-items: center;
            
        }

        .linha{
            display: block;
            width: 25px;
            height: 3px;
            background-color: #000000;
        }
        
        .botao{
            width:50px;
            height:50px;
            margin: 20px;
            background-image: url("https://static.vecteezy.com/system/resources/previews/014/177/839/non_2x/rounded-menu-button-free-png.png");
            background-repeat: no-repeat;
            background-size: cover;


            
            box-shadow: 10px 5px 15px 0px rgba(0, 0, 0, 0.20);
            border-radius: 8px;
        }

        .botao:hover .lista{
            display: flex;
            flex-direction: column;
            align-items: end;
            background-color: rgba(68, 51, 223, 0.24);

            
        }

        .lista li {

            width: 17vw;
            height: 25px;
            
            margin-top: 10px;
            margin-right: 9px;
            border: solid;

            background-color: rgb(172, 166, 166);
        }

        .lista li a{
            text-size-adjust: 30px;
        }


    </style>
</head>
<body>
    
    <nav>


        <h1>isso é uma barra de navegação </h1>
        
        <button class="botao">
            
            

            <ul class="lista" >

                <li>
                    <a href="clica_aqui.html">jogar</a>
                </li>

                <li>
                    <a href="#">outro botao</a>
                </li>

                <li>
                    <a href="nao_clica.html">nao-clica</a>
                </li>
            </ul>
        </button>
    </nav>
    
</body>
</html>
