<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>


    <style>
        body {
        font-family: Arial, sans-serif;
        background: #eef2ff;
        color: #172554;
        margin: 0; padding: 24px;
    }
    main {
        max-width: 440px;
        margin: 40px auto;
        background: white;
        padding: 24px; border-radius: 16px;
    }
    input, button {
        display: block; width: 100%;
        box-sizing: border-box;
        margin-top: 12px; padding: 12px;
        font-size: 18px;
    }
    button { background: #2563eb; color: white; }

    #resultado {
        font-weight: bold;
        white-space: pre-line;
    }

    </style>
</head>
<body>
    <main>
        <h1>Mural de boas-vindas</h1>
        <form onsubmit="gerar(); return false;">
        <label for="entrada">
            Quantas mensagens?
        </label>
        <input id="entrada" type="number">
        <button type="submit">Gerar</button>
        </form>
        <p id="resultado" aria-live="polite"> eu sou o paragrafo</p>
    </main>


    <script>
        function gerar() {
        const n = Number(
            document.getElementById("entrada").value
        );
        const resultado =
            document.getElementById("resultado");
        let texto = "     ";
        for (let i = 1; i < 3; i += 1) {
            texto += "Bem-vindo!\n"; 
        }
        resultado.textContent = texto;
        }


    </script>
</body>
</html>
